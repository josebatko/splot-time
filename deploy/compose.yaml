name: splot-time
services:
  app:
    image: splot-time:local
    container_name: splot-time
    restart: unless-stopped
    init: true
    env_file: /etc/splot-time/secrets.env
    environment:
      DATABASE_PATH: /data/splot-time.db
      COMPANION_HOST: 0.0.0.0
      COMPANION_PORT: 5601
    volumes:
      - /var/lib/splot-time:/data
    ports:
      - "127.0.0.1:15601:5601"
    networks:
      - coolify
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5601/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
networks:
  coolify:
    external: true
